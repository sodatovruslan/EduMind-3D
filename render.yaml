# Blueprint для Render: поднимает базу и бэкенд одной кнопкой Apply.
# Вводить вручную ничего не нужно — DATABASE_URL и SECRET_KEY Render
# подставляет сам.
#
# Фронтенд тут сознательно отсутствует — он живёт на Vercel.
#
# ВНИМАНИЕ про базу: бесплатный Postgres на Render удаляется через 30 дней
# после создания (плюс 14 дней отсрочки), вместе с данными. Это осознанный
# выбор ради демо «здесь и сейчас». Для пилота со школами базу надо увести
# на бессрочный бесплатный план Neon — тогда меняется ровно одна переменная
# DATABASE_URL у сервиса, код трогать не придётся: строки с sslmode и
# пулером он уже умеет (см. app/config.py и app/database.py).
databases:
  - name: edumind-db
    databaseName: edumind
    user: edumind
    plan: free
    region: frankfurt

services:
  - type: web
    name: edumind-backend
    runtime: docker
    repo: https://github.com/ParvizSodatov/EduMind-3D
    branch: main
    # Пути от корня репозитория: Dockerfile лежит в backend/, туда же
    # ограничен контекст сборки, чтобы фронтенд не уезжал в образ.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Демо-стенд без SMTP: без этого флага регистрация отдаёт 503, а вход —
      # 403 EMAIL_NOT_VERIFIED, т.е. войти нельзя вообще никак.
      - key: AUTO_VERIFY_EMAIL
        value: "true"
      # Render сгенерирует стойкое значение сам — секрет не проходит через
      # репозиторий, чат и мою историю команд.
      - key: SECRET_KEY
        generateValue: true
      # Домен фронта на Vercel. Превью-деплои имеют другие адреса и в этот
      # список не попадают — их браузер заблокирует по CORS.
      - key: CORS_ORIGINS
        value: https://edumind-3d-parvizsodatovs-projects.vercel.app
      # Адрес базы Render подставляет сам из блока databases выше.
      - key: DATABASE_URL
        fromDatabase:
          name: edumind-db
          property: connectionString
